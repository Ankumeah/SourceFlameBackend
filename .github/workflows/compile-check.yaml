name: compile-check

on: [ push, pull_request ]

jobs:
  compile-check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        go-version: [ "1.25.5", "stable" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Install deps
        working-directory: backend/
        run: go mod download

      - name: Compile
        working-directory: backend/
        run: go build ./cmd/sourceflame-server/
