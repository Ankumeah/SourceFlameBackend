name: go-tests

on: [ push, pull_request ]

jobs:
  go-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        go-version: [ "1.25.5", "stable" ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Install deps
        working-directory: backend/
        run: go mod download

      - name: Load env vars
        run: cat env.d.example/backend >> $GITHUB_ENV

      - name: Run tests
        working-directory: backend/
        run: go test ./... -v
