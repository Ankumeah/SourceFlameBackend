apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      name: backend
  template:
    metadata:
      name: backend
      labels:
        name: backend
    spec:
      containers:
        - name: backend
          image: deltabase-backend:local
