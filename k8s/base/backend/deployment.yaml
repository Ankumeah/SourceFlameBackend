apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      name: backend
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: sourceflamebackend-backend:local
          volumeMounts:
            - name: git-storage
              mountPath: /srv/git
          envFrom:
            - secretRef:
                name: backend-secrets
            - configMapRef:
                name: backend-config-map
            - secretRef:
                name: session-store-secrets
            - configMapRef:
                name: session-store-config-map
            - secretRef:
                name: database-secrets
      volumes:
        - name: git-storage
          persistentVolumeClaim:
            claimName: git-storage
