apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  labels:
    app: database
spec:
  serviceName: database-service
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      name: database
      labels:
        app: database
    spec:
      containers:
        - name: postgres
          image: sourceflamebackend-database:local
          volumeMounts:
            - name: database-storage
              mountPath: /var/lib/postgresql
          envFrom:
            - secretRef:
                name: database-secrets
      volumes:
        - name: database-storage
          persistentVolumeClaim:
            claimName: database-storage
