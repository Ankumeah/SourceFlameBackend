apiVersion: batch/v1
kind: CronJob
metadata:
  name: session-store-gc-cron
spec:
  schedule: "*/5 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: session-store-gc-cron
              image: sourceflamebackend-session_store_gc:local
              envFrom:
                - configMapRef:
                    name: session-store-config-map
                - secretRef:
                    name: session-store-secrets
