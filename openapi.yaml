openapi: 3.0.0
info:
  title: SourceFlame API
  version: v0.0.1
  description: "NOTE: This openapi.yaml was Ai generated (boooo ik), so please be cautious. If you want a non Ai generated doc, have a look at doc.md at the root of the git repo"
servers:
  - url: http://localhost:8000

paths:
  /login:
    post:
      summary: Login with credentials
      tags:
        - Login
      security:
        - SelfAuth: []
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
                  JWT:
                    type: string
        default:
          $ref: '#/components/responses/Error'

  /pat/{pat_name}:
    post:
      summary: Create a Personal Access Token
      tags:
        - PATs
      security:
        - SelfAuth: []
      parameters:
        - name: pat_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PAT created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  PAT:
                    type: string
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: Get PAT details
      tags:
        - PATs
      security:
        - SelfAuth: []
      parameters:
        - name: pat_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PAT details
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  creation:
                    type: integer
                    format: uint64
                  last_used:
                    type: integer
                    format: uint64
                    nullable: true
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a Personal Access Token
      tags:
        - PATs
      security:
        - SelfAuth: []
      parameters:
        - name: pat_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: PAT deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /pat/all:
    get:
      summary: List all Personal Access Tokens
      tags:
        - PATs
      security:
        - SelfAuth: []
      responses:
        '200':
          description: List of all PATs
          content:
            application/json:
              schema:
                type: object
                properties:
                  PATs:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'

  /repo/{repo_owner}/{repo_name}/meta:
    get:
      summary: Get repository metadata
      tags:
        - Repo
      parameters:
        - name: repo_owner
          in: path
          required: true
          schema:
            type: string
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repo metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  creation:
                    type: integer
                    format: uint64
                  stars:
                    type: integer
                    format: uint64
                  owner:
                    type: string
        default:
          $ref: '#/components/responses/Error'

  /repo/{repo_owner}/{repo_name}/blob/{path}:
    get:
      summary: Get blob/file contents
      tags:
        - Repo
      parameters:
        - name: repo_owner
          in: path
          required: true
          schema:
            type: string
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File contents
          headers:
            Content-Type:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/Error'

  /repo/{repo_owner}/{repo_name}/list/{path}:
    get:
      summary: List directory contents
      tags:
        - Repo
      parameters:
        - name: repo_owner
          in: path
          required: true
          schema:
            type: string
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
        - name: path
          in: path
          required: true
          schema:
            type: string
        - name: hash
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Directory listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        file_name:
                          type: string
                        dir:
                          type: boolean
        default:
          $ref: '#/components/responses/Error'

  /repo/{repo_owner}/{repo_name}/info/refs:
    get:
      summary: Git protocol info refs
      tags:
        - Repo
      parameters:
        - name: repo_owner
          in: path
          required: true
          schema:
            type: string
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
        - name: service
          in: query
          required: true
          schema:
            type: string
            enum:
              - git-receive-pack
              - git-upload-pack
      responses:
        '200':
          description: Git refs information
        default:
          $ref: '#/components/responses/Error'

  /repo/{repo_owner}/{repo_name}/git-upload-pack:
    post:
      summary: Git upload pack
      tags:
        - Repo
      parameters:
        - name: repo_owner
          in: path
          required: true
          schema:
            type: string
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Upload pack response
        default:
          $ref: '#/components/responses/Error'

  /repo/{repo_owner}/{repo_name}/git-receive-pack:
    post:
      summary: Git receive pack
      tags:
        - Repo
      security:
        - PatAuth: []
      parameters:
        - name: repo_owner
          in: path
          required: true
          schema:
            type: string
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receive pack response
        default:
          $ref: '#/components/responses/Error'

  /repos/{repo_name}:
    post:
      summary: Create a new repository
      tags:
        - Self Repositories
      security:
        - JWTAuth: []
      parameters:
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repo created successfully
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: Delete a repository
      tags:
        - Self Repositories
      security:
        - JWTAuth: []
      parameters:
        - name: repo_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Repo deleted successfully
        default:
          $ref: '#/components/responses/Error'

  /user/{username}/meta:
    get:
      summary: Get user metadata
      tags:
        - User
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  creation:
                    type: integer
                    format: uint64
        default:
          $ref: '#/components/responses/Error'

  /user/{username}/repos:
    get:
      summary: Get user repositories
      tags:
        - User
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            format: uint8
            default: 10
        - name: offset
          in: query
          schema:
            type: integer
            format: uint64
            default: 0
      responses:
        '200':
          description: List of user repositories
          content:
            application/json:
              schema:
                type: object
                properties:
                  repos:
                    type: array
                    items:
                      type: string
        default:
          $ref: '#/components/responses/Error'

  /session/renew_jwt:
    post:
      summary: Renew JWT token
      tags:
        - Session
      security:
        - RefreshTokenAuth: []
      parameters:
        - name: X-Username
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New JWT token
          content:
            application/json:
              schema:
                type: object
                properties:
                  JWT:
                    type: string
        default:
          $ref: '#/components/responses/Error'

  /session/renew_session:
    post:
      summary: Renew refresh token
      description: "NOTE: Old refresh token is deleted"
      tags:
        - Session
      security:
        - RefreshTokenAuth: []
      parameters:
        - name: X-Username
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: New refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  refresh_token:
                    type: string
        default:
          $ref: '#/components/responses/Error'

  /session:
    delete:
      summary: Delete session
      tags:
        - Session
      security:
        - RefreshTokenAuth: []
      parameters:
        - name: X-Username
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session deleted successfully
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    SelfAuth:
      type: apiKey
      in: header
      name: X-Authorization
      description: Base64 encoded username:password
    PatAuth:
      type: http
      scheme: basic
      description: PAT
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token
    RefreshTokenAuth:
      type: http
      scheme: bearer
      description: Refresh token
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
